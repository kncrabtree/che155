name: che155-ml
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - jupyterlab
  - ipykernel
  - ipywidgets
  - numpy>=1.24
  - scipy
  - matplotlib
  - pandas
  - pytorch
  - jax
